<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | AgriConnectX</title>

<link rel="stylesheet" href="../style/dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
      <div class="logo">
          <h2>AgriConnectX</h2>
          <span>Admin Panel</span>
      </div>

      <ul class="menu">
          <li data-route="dashboard" class="active">
            <i class="fas fa-chart-line"></i> Dashboard
          </li>

          <li data-route="users" id="usersMenu">
            <i class="fas fa-users"></i> Users
          </li>

          <li data-route="products">
            <i class="fas fa-box"></i> Products
          </li>

          <li data-route="escrow">
            <i class="fas fa-wallet"></i> Escrow
          </li>

          <li data-route="logistics">
            <i class="fas fa-truck"></i> Logistics
          </li>

          <li data-route="disputes">
            <i class="fas fa-exclamation-circle"></i> Disputes
          </li>
      </ul>

      <div class="logout">
          <button type="button" id="logoutBtn">Logout</button>
      </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

      <header class="topbar">
          <h1 id="pageTitle">Dashboard</h1>
          <div class="profile">
              <img src="https://i.pravatar.cc/100" alt="Admin Profile">
              <span>Admin</span>
          </div>
      </header>

      <!-- DYNAMIC CONTENT AREA -->
      <section id="appContent">
       <div class="loading">

<i class="fas fa-spinner fa-spin"></i>

<p>Loading content...</p>

</div>
      </section>

  </main>

</div>

<!-- Add User Modal -->

 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module"  src="./js/app.js"></script>
</body>
</html>
