<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnectX</title>
    <link rel="stylesheet" href="style/auth.css">
</head>
<body>
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="auth-container">
                <div class="auth-forms">
                    <!-- Login Form -->
                    <form id="loginForm" class="auth-form active">
                        <h3>Login to Your Account</h3>
                        <div class="form-group">
                            <input type="email" id="loginEmail" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="loginPassword" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                        <p class="switch-form">Don't have an account? <a href="#" id="showRegister">Register</a></p>
                    </form>

                    <!-- Register Form -->
                    <form id="registerForm" class="auth-form">
                        <h3>Create an Account</h3>
                        <div class="form-row">
                            <div class="form-group half">
                                <input type="text" id="firstName" placeholder="First Name" required>
                            </div>
                            <div class="form-group half">
                                <input type="text" id="lastName" placeholder="Last Name" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <input type="email" id="registerEmail" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" id="phone" placeholder="Phone Number" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="registerPassword" placeholder="Password" required>
                        </div>
                        <div class="form-group">
                            <select id="role" required>
                                <option value="">Select Role</option>
                                <option value="farmer">Farmer</option>
                                <option value="buyer">Buyer</option>
                            </select>
                        </div>
                        <div id="farmerFields" style="display: none;">
                            <div class="form-group">
                                <input type="text" id="farmName" placeholder="Farm Name">
                            </div>
                            <div class="form-group">
                                <input type="text" id="farmLocation" placeholder="Farm Location">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                        <p class="switch-form">Already have an account? <a href="#" id="showLogin">Login</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
