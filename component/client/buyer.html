<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnectX - Fresh from Farmers</title>
    <link rel="stylesheet" href="../style/buyer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <h2 class="logo">AgriConnectX</h2>
        <div class="location">
            <i class="fas fa-map-marker-alt"></i>
            <span>Centre Region, Cameroon</span>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search maize, cassava, tomatoes, eggs..." class="search">
        <button class="search-btn"><i class="fas fa-search"></i></button>
    </div>

    <div class="nav-right">
        <a href="#" data-route="marketplace" class="nav-link active">
            <i class="fas fa-store"></i> Marketplace
        </a>
        <a href="#" data-route="orders" class="nav-link">
            <i class="fas fa-shopping-bag"></i> Orders
        </a>
        <a href="#" data-route="wishlist" class="nav-link">
            <i class="fas fa-heart"></i> Wishlist
        </a>

        <div class="notifications">
            <i class="fas fa-bell"></i>
            <span id="notifCount" class="badge">3</span>
        </div>

        <div class="cart-icon" onclick="showCart()">
            <i class="fas fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </div>

        <div class="profile">
            <img src="https://i.pravatar.cc/100" alt="Profile">
            <span id="buyerName">Bob</span>
        </div>

        <button id="logoutBtn" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</header>

<main>
    <h1 id="pageTitle">Marketplace - Fresh from Local Farmers</h1>
    <section id="appContent"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="./js/buyer.js"></script>
</body>
</html>
