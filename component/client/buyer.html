<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer | AgriConnectX</title>

<link rel="stylesheet" href="../style/buyer.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
      <div class="logo">
          <h2>AgriConnectX</h2>
          <span>Buyer Panel</span>
      </div>

      <ul class="menu">
          <li data-route="overview" class="active"><i class="fas fa-chart-pie"></i> Overview</li>
          <li data-route="products"><i class="fas fa-store"></i> Browse Products</li>
          <li data-route="orders"><i class="fas fa-shopping-bag"></i> My Orders</li>
          <li data-route="bids"><i class="fas fa-gavel"></i> Bulk Requests</li>
          <li data-route="tracking"><i class="fas fa-truck-moving"></i> Shipment Tracking</li>
          <li data-route="wallet"><i class="fas fa-wallet"></i> Wallet</li>
          <li data-route="messages"><i class="fas fa-comments"></i> Messages</li>
          <li data-route="profile"><i class="fas fa-user"></i> Profile</li>
      </ul>

      <button id="logoutBtn">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

      <header class="topbar">
          <h1 id="pageTitle">Overview</h1>
          <div class="profile">
              <img src="https://i.pravatar.cc/100">
              <span>Buyer</span>
          </div>
      </header>

      <section id="appContent"></section>

  </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./js/buyer.js"></script>
</body>
</html>
