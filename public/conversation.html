<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Messages - AgriMarket</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Socket.io client CDN -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">AgriMarket</a>
    <nav>
      <a href="products.html">Products</a>
      <a href="conversation.html">Messages</a>
      <button id="loginBtn" class="btn small">Login</button>
    </nav>
  </header>

  <main class="container" id="app">
    <!-- Inbox or conversation will render here -->
  </main>

  <script type="module">
    import '/js/auth.js';
    import { loadConversations, loadConversation } from '/js/messages.js';
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const withId = params.get('with');
      if (withId) loadConversation(withId, 'app');
      else loadConversations('app');
    });
  </script>
</body>
</html>
