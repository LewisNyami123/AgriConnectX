<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Farmer Dashboard - AgriMarket</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">AgriMarket</a>
    <nav class="nav">
      <a class="btn ghost" href="/products/create.html">Create Product</a>
      <a class="btn ghost" href="/messages/inbox.html">Messages</a>
      <button id="logoutBtn" class="btn">Logout</button>
    </nav>
  </header>

  <main class="container">
    <div class="header-row">
      <h2>Farmer Dashboard</h2>
      <div class="small">Manage inventory, offers, and view farm analytics.</div>
    </div>

    <section class="grid cols-3">
      <div class="card">
        <h3>Your products</h3>
        <div id="myProducts">Loading…</div>
      </div>
      <div class="card">
        <h3>Pending offers</h3>
        <div id="offersList">Loading…</div>
      </div>
      <div class="card">
        <h3>Farm weather</h3>
        <div id="farmWeather">Loading…</div>
      </div>
    </section>
  </main>

  <script type="module">
    import '/js/auth.js';
    import { renderMyProducts } from '/js/products.js';
    import { renderOffers } from '/js/dashboard.js';
    import { renderWeather } from '/js/weather.js';
    document.addEventListener('DOMContentLoaded', () => {
      renderMyProducts('myProducts');
      renderOffers('offersList');
      // sample coords fallback
      renderWeather(4.0511, 9.7679, 'farmWeather');
    });
  </script>
</body>
</html>
