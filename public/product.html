<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product - AgriMarket</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">AgriMarket</a>
    <nav>
      <a href="products.html">Products</a>
      <a href="conversation.html">Messages</a>
      <button id="loginBtn" class="btn small">Login</button>
    </nav>
  </header>

  <main class="container" id="app">
    <div id="productCard" class="card">Loading product…</div>
  </main>

  <script type="module">
    import 'js/auth.js';
    import { renderProduct } from 'js/product.js';
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) document.getElementById('productCard').innerText = 'Product id missing';
      else renderProduct(id, 'productCard');
    });
  </script>
</body>
</html>
